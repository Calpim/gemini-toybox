<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vertical Survivor Rogue - Wing Laser Edition</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #07090e;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: radial-gradient(circle at 50% 20%, #151833 0%, #05060b 100%);
      box-shadow: 0 0 35px rgba(99, 102, 241, 0.25);
    }
    .card-hover:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4">

  <!-- ゲームコンテナ -->
  <div class="relative w-full max-w-[420px] aspect-[9/16] max-h-[92vh] rounded-2xl overflow-hidden border border-slate-700 bg-black shadow-2xl flex flex-col">
    
      <!-- ヘッダーHUD -->
      <div class="absolute top-0 left-0 right-0 z-10 px-3.5 py-2 bg-gradient-to-b from-black/90 via-black/50 to-transparent flex flex-col gap-1.5 pointer-events-none">
        <div class="flex justify-between items-center text-xs font-bold tracking-wider text-slate-300">
          <span id="level-display" class="bg-indigo-600 px-2 py-0.5 rounded text-white shadow font-mono">LV 1</span>
          <span id="time-display" class="font-mono text-sm text-amber-300">00:00</span>
          <div class="flex items-center gap-1.5">
            <span id="score-display" class="hidden xs:inline">SCORE: 0</span>
            <div class="pointer-events-auto flex items-center gap-1.5 bg-slate-900/80 px-2 py-0.5 rounded-lg border border-slate-700/80">
              <button id="sound-toggle-btn" class="text-xs flex items-center justify-center text-slate-200 active:scale-90 transition-transform" title="サウンド切替">🔊</button>
              <input id="sound-volume-slider" type="range" min="0" max="1" step="0.05" value="0.7" class="w-12 sm:w-16 h-1.5 bg-slate-700 accent-indigo-400 rounded-lg cursor-pointer" title="音量調整">
            </div>
          </div>
        </div>

        <!-- EXPバー -->
        <div class="w-full bg-slate-900/90 h-2.5 rounded-full overflow-hidden border border-slate-700/60">
          <div id="exp-bar" class="bg-gradient-to-r from-emerald-400 to-cyan-400 h-full w-0 transition-all duration-150"></div>
        </div>

        <!-- 拠点シールドHP -->
        <div class="flex items-center gap-2">
          <span class="text-[10px] text-cyan-400 font-extrabold tracking-wider">CORE SHIELD</span>
          <div class="flex-1 bg-slate-900/90 h-2 rounded-full overflow-hidden border border-cyan-800/50">
            <div id="hp-bar" class="bg-gradient-to-r from-cyan-400 to-blue-500 h-full w-full transition-all duration-150"></div>
          </div>
          <span id="hp-text" class="text-[10px] font-mono text-cyan-300">100/100</span>
        </div>

        <!-- 獲得スキル一覧バッジバー -->
        <div id="skills-badge-container" class="flex flex-wrap gap-1.5 pt-0.5 min-h-[22px]"></div>
      </div>

      <!-- メインCanvas -->
      <canvas id="gameCanvas" class="w-full h-full"></canvas>

      <!-- レベルアップ 3択モーダル -->
      <div id="level-up-modal" class="absolute inset-0 z-30 bg-black/85 backdrop-blur-md flex flex-col justify-center items-center p-5 hidden">
        <div class="text-amber-400 font-black text-2xl tracking-widest mb-1 drop-shadow animate-bounce">LEVEL UP!</div>
        <p class="text-xs text-slate-300 mb-4">強化スキルを選択してください（最大Lv 5）</p>
        
        <div id="card-container" class="w-full flex flex-col gap-2.5">
          <!-- JSで3枚のカードを動的生成 -->
        </div>
      </div>

      <!-- スタート / ゲームオーバー画面 -->
      <div id="overlay-screen" class="absolute inset-0 z-20 bg-gradient-to-b from-black/80 via-black/40 to-black/85 backdrop-blur-[2px] flex flex-col justify-center items-center p-6 text-center">
        <div id="overlay-title" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-400 to-fuchsia-400 mb-2">
          SURVIVOR ROGUE
        </div>
        <p id="overlay-subtitle" class="text-xs text-slate-300 mb-3.5 leading-relaxed max-w-[290px]">
          下部エリアをスワイプして自機を移動！<br>
          迫る大軍勢を防衛ライン手前で迎撃せよ！
        </p>

        <!-- 背景ステージ選択 -->
        <div class="w-full max-w-[310px] mb-3 bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/80">
          <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">SELECT BATTLEFIELD</div>
          <div class="grid grid-cols-3 gap-1.5" id="stage-select-buttons">
            <button data-stage="space" class="stage-btn active py-2 px-1 rounded-lg border border-indigo-500 bg-indigo-600/30 text-[11px] font-bold flex flex-col items-center gap-0.5 transition-all text-white shadow shadow-indigo-500/20">
              <span class="text-base">🌌</span>
              <span>宇宙</span>
            </button>
            <button data-stage="wasteland" class="stage-btn py-2 px-1 rounded-lg border border-slate-700 bg-slate-800/50 text-[11px] font-bold flex flex-col items-center gap-0.5 transition-all text-slate-400 hover:text-white">
              <span class="text-base">🏜️</span>
              <span>荒野</span>
            </button>
            <button data-stage="ocean" class="stage-btn py-2 px-1 rounded-lg border border-slate-700 bg-slate-800/50 text-[11px] font-bold flex flex-col items-center gap-0.5 transition-all text-slate-400 hover:text-white">
              <span class="text-base">🌊</span>
              <span>深海</span>
            </button>
          </div>
        </div>

        <!-- 音量調整バー -->
        <div class="w-full max-w-[310px] mb-5 bg-slate-900/80 px-3 py-2 rounded-xl border border-slate-700/80 flex items-center justify-between text-xs text-slate-300">
          <div class="flex items-center gap-2">
            <span id="overlay-vol-icon">🔊</span>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">VOLUME</span>
          </div>
          <div class="flex items-center gap-2">
            <input id="overlay-vol-slider" type="range" min="0" max="1" step="0.05" value="0.7" class="w-28 h-1.5 bg-slate-700 accent-indigo-400 rounded-lg cursor-pointer">
            <span id="overlay-vol-text" class="font-mono text-[11px] text-indigo-300 w-8 text-right">70%</span>
          </div>
        </div>

        <button id="start-btn" class="px-8 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold text-base rounded-xl shadow-lg shadow-indigo-500/30 active:scale-95 transition-all flex items-center gap-2">
          <span>START MISSION</span>
          <span>▶</span>
        </button>
      </div>

  </div>

  <div class="mt-2 text-xs text-slate-400 text-center flex flex-col gap-0.5">
    <span>💡 画面最下部のスワイプ操作エリアで指隠れゼロ！</span>
    <span class="text-slate-500">PC：矢印キーまたは画面ドラッグ</span>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resizeCanvas);

    let gameState = 'ready';
    let score = 0;
    let gameTime = 0;
    let lastTime = 0;
    let screenShake = 0;
    let currentStage = 'space'; // 'space', 'wasteland', 'ocean'

    // ===== 背景グラフィック（Gemini生成リアルグラフィック ＋ プリロード） =====
    const stageImages = {
      space: new Image(),
      wasteland: new Image(),
      ocean: new Image()
    };
    const stageImagesLoaded = {
      space: false,
      wasteland: false,
      ocean: false
    };

    stageImages.space.src = BG_DATA.space;

    stageImages.wasteland.onload = () => { stageImagesLoaded.wasteland = true; };

    stageImages.ocean.src = BG_DATA.ocean;

    // ===== サウンドシステム（Web Audio API プロシージャル音源 ＋ マスター音量） =====
    let audioCtx = null;
    let masterGain = null;
    let masterVolume = 0.7; // デフォルト70%
    let soundMuted = false;
    let bgmStep = 0;
    let bgmTimer = 0;
    let noiseBuffer = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(soundMuted ? 0 : masterVolume, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function getMasterGain() {
      if (!audioCtx) initAudio();
      if (!masterGain && audioCtx) {
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(soundMuted ? 0 : masterVolume, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
      }
      return masterGain || (audioCtx ? audioCtx.destination : null);
    }

    function setMasterVolume(val) {
      masterVolume = Math.max(0, Math.min(1, parseFloat(val) || 0));
      if (masterGain && audioCtx) {
        masterGain.gain.setValueAtTime(soundMuted ? 0 : masterVolume, audioCtx.currentTime);
      }
      updateVolumeUI();
    }

    function toggleMute() {
      initAudio();
      soundMuted = !soundMuted;
      if (masterGain && audioCtx) {
        masterGain.gain.setValueAtTime(soundMuted ? 0 : masterVolume, audioCtx.currentTime);
      }
      updateVolumeUI();
    }

    function updateVolumeUI() {
      const volIcon = soundMuted || masterVolume <= 0 ? '🔇' : (masterVolume < 0.35 ? '🔈' : (masterVolume < 0.7 ? '🔉' : '🔊'));
      const btn = document.getElementById('sound-toggle-btn');
      if (btn) btn.textContent = volIcon;

      const hudSlider = document.getElementById('sound-volume-slider');
      if (hudSlider) hudSlider.value = soundMuted ? 0 : masterVolume;

      const overlaySlider = document.getElementById('overlay-vol-slider');
      if (overlaySlider) overlaySlider.value = soundMuted ? 0 : masterVolume;

      const overlayIcon = document.getElementById('overlay-vol-icon');
      if (overlayIcon) overlayIcon.textContent = volIcon;

      const overlayText = document.getElementById('overlay-vol-text');
      if (overlayText) overlayText.textContent = `${Math.round((soundMuted ? 0 : masterVolume) * 100)}%`;
    }

    function getNoiseBuffer() {
      if (!audioCtx) return null;
      if (!noiseBuffer) {
        const bufferSize = audioCtx.sampleRate * 1.5;
        noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
      }
      return noiseBuffer;
    }

    function playExplodeSound(big = false) {
      if (soundMuted || !audioCtx) return;
      const nb = getNoiseBuffer();
      if (!nb) return;
      const now = audioCtx.currentTime;
      const src = audioCtx.createBufferSource();
      src.buffer = nb;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(big ? 550 : 850, now);
      filter.frequency.exponentialRampToValueAtTime(50, now + (big ? 0.45 : 0.22));

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(big ? 0.35 : 0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + (big ? 0.45 : 0.22));

      src.connect(filter);
      filter.connect(gain);
      gain.connect(getMasterGain());
      src.start(now);
      src.stop(now + (big ? 0.45 : 0.22));

      if (big) {
        const subOsc = audioCtx.createOscillator();
        const subGain = audioCtx.createGain();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(130, now);
        subOsc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
        subGain.gain.setValueAtTime(0.28, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

    function updateBGM(dt) {
      if (soundMuted || !audioCtx || (gameState !== 'playing' && gameState !== 'ready')) return;
      const pattern = BGM_PATTERNS[currentStage] || BGM_PATTERNS.space;
      bgmTimer -= dt;
      if (bgmTimer <= 0) {
        bgmTimer = pattern.tempo;
        const step = bgmStep % 16;
        const now = audioCtx.currentTime;

        // ベースライン
        const bassFreq = pattern.bass[step];
        if (bassFreq > 0) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = currentStage === 'wasteland' ? 'sawtooth' : 'triangle';
          osc.frequency.setValueAtTime(bassFreq, now);
          const dur = pattern.tempo * 0.85;
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.connect(gain);
          gain.connect(getMasterGain());
          osc.start(now);
          osc.stop(now + dur);
        }

        // メロディ・アルペジオ
        const leadFreq = pattern.lead[step];
        if (leadFreq > 0 && Math.random() < 0.88) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = currentStage === 'ocean' ? 'sine' : 'square';
          osc.frequency.setValueAtTime(leadFreq, now);
          const dur = pattern.tempo * 0.7;
          gain.gain.setValueAtTime(0.02, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.connect(gain);
          gain.connect(getMasterGain());
          osc.start(now);
          osc.stop(now + dur);
        }

        // リズムパーカッション
        if (step % 2 === 0 || step === 4 || step === 12) {
          const nb = getNoiseBuffer();
          if (nb) {
            const src = audioCtx.createBufferSource();
            src.buffer = nb;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.setValueAtTime(step % 4 === 0 ? 2800 : 6500, now);
            const gain = audioCtx.createGain();
            const vol = step % 4 === 0 ? 0.03 : 0.012;
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
            src.connect(filter);
            filter.connect(gain);
            gain.connect(getMasterGain());
            src.start(now);
            src.stop(now + 0.035);
          }
        }

        bgmStep++;
      }
    }

      if (!isTouching || gameState !== 'playing') return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const deltaX = clientX - touchStartX;
      player.x = playerStartX + deltaX;

      player.x = Math.max(player.width / 2 + 10, Math.min(rect.width - player.width / 2 - 10, player.x));

      gameState = 'levelup';
      document.getElementById('level-up-modal').classList.remove('hidden');

      const availableSkills = Object.values(SKILLS).filter(s => s.level < s.maxLevel);
      let selected = [];
      if (availableSkills.length > 0) {
        selected = [...availableSkills].sort(() => 0.5 - Math.random()).slice(0, 3);
      }

      const container = document.getElementById('card-container');
      container.innerHTML = '';

      if (selected.length === 0) {
        const btn = document.createElement('button');
        btn.className = 'w-full text-left p-3.5 rounded-xl border border-emerald-500/50 bg-emerald-500/20 card-hover flex items-center gap-3';
        btn.innerHTML = `
          <div class="text-2xl p-2 bg-black/50 rounded-lg">💎</div>
          <div class="flex-1">
            <div class="font-bold text-sm text-emerald-300">シールド全快＆スコアボーナス</div>
            <div class="text-[11px] text-slate-300">全兵装カンスト達成！コアシールドを完全修復します</div>
          </div>
        `;
        btn.onclick = () => {
          player.hp = player.maxHp;
          score += 1500;
          closeLevelUp();
        };
        container.appendChild(btn);
        return;
      }

      selected.forEach(skill => {
        const nextLvl = skill.level + 1;
        const isMaxUpgrade = nextLvl === skill.maxLevel;
        const btn = document.createElement('button');
        btn.className = `w-full text-left p-3 rounded-xl border bg-gradient-to-r ${skill.color} backdrop-blur-sm card-hover flex items-center gap-3 transition-transform ${isMaxUpgrade ? 'ring-2 ring-amber-400/80 shadow-lg shadow-amber-500/20' : ''}`;

        let starGauge = '';
        for (let i = 1; i <= skill.maxLevel; i++) {
          if (i <= skill.level) starGauge += '<span class="text-amber-400">★</span>';
          else if (i === nextLvl) starGauge += '<span class="text-amber-200 animate-pulse">★</span>';
          else starGauge += '<span class="text-slate-600">☆</span>';
        }

        btn.innerHTML = `
          <div class="text-2xl p-2 bg-black/50 rounded-lg flex-shrink-0">${skill.icon}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="font-bold text-sm text-white">${skill.name}</span>
              <span class="text-[11px] font-mono tracking-tighter">${starGauge}</span>
            </div>
            <div class="text-[11px] ${isMaxUpgrade ? 'text-amber-300 font-bold' : 'text-slate-300'} leading-tight mt-0.5">
              ${skill.desc[nextLvl - 1]}
            </div>
          </div>
        `;
        btn.onclick = () => {
          skill.level += 1;
          skill.onUpgrade(skill.level);
          closeLevelUp();
        };
        container.appendChild(btn);
      });
    }

    function closeLevelUp() {
      document.getElementById('level-up-modal').classList.add('hidden');
      gameState = 'playing';
      lastTime = performance.now();
      updateHUD();
      updateSkillsBadge();
    }

    function addExp(amount) {
      player.exp += amount;
      if (player.exp >= player.nextExp) {
        player.exp -= player.nextExp;
        player.level += 1;
        player.nextExp = Math.floor(player.nextExp * 1.38);
        triggerLevelUp();
      }
      updateHUD();
    }

    function updateHUD() {
      document.getElementById('level-display').textContent = `LV ${player.level}`;
      document.getElementById('score-display').textContent = `SCORE: ${score}`;
      
      const expPercent = Math.min(100, (player.exp / player.nextExp) * 100);
      document.getElementById('exp-bar').style.width = `${expPercent}%`;

      const hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
      document.getElementById('hp-bar').style.width = `${hpPercent}%`;
      document.getElementById('hp-text').textContent = `${Math.ceil(player.hp)}/${player.maxHp}`;

      const m = Math.floor(gameTime / 60).toString().padStart(2, '0');
      const s = Math.floor(gameTime % 60).toString().padStart(2, '0');
      document.getElementById('time-display').textContent = `${m}:${s}`;
    }

    // 敵スポーン（自機狙いチェイサー、直進ラッシャー、遠距離シューター、シージ）
    function spawnEnemy(cw) {
      const tierChance = Math.random();
      const totalSkills = getTotalSkillLevel();

      let type = 'normal';
      let hp = 18 + Math.floor(gameTime * 0.8) + totalSkills * 2;
      let speed = 65 + Math.random() * 30;
      let size = 15;
      let color = '#f87171';
      let expValue = 1;
      let damageToCore = 12;
      let shootTimer = 0;
      let vx = 0;

      if (gameTime > 10 && tierChance < 0.28) {
        // ★新敵：自機追尾型チェイサー（自機のX座標を狙ってカーブ急降下特攻！）
        type = 'chaser';
        hp = 16 + Math.floor(gameTime * 0.7) + totalSkills * 1.6;
        speed = 88 + Math.random() * 25;
        size = 14;
        color = '#10b981'; // エメラルドグリーン
        expValue = 2;
        damageToCore = 16;
        vx = 0;
      } else if (gameTime > 18 && tierChance >= 0.28 && tierChance < 0.50) {
        // 遠距離シューター型
        type = 'shooter';
        hp = 22 + Math.floor(gameTime * 0.8) + totalSkills * 2;
        speed = 42;
        size = 16;
        color = '#38bdf8';
        expValue = 2;
        damageToCore = 15;
        shootTimer = 1.0 + Math.random() * 1.4;
      } else if (gameTime > 25 && tierChance >= 0.50 && tierChance < 0.76) {
        // 直進ラッシャー型（すり抜け注意）
        type = 'rusher';
        hp = 14 + Math.floor(gameTime * 0.6) + totalSkills * 1.5;
        speed = 135 + Math.random() * 40;
        size = 12;
        color = '#fbbf24';
        expValue = 2;
        damageToCore = 10;
      } else if ((gameTime > 50 || totalSkills >= 8) && tierChance >= 0.76) {
        // 大型シージ型
        type = 'siege';
        hp = 85 + Math.floor(gameTime * 2.5) + totalSkills * 8;
        speed = 36;
        size = 23;
        color = '#c084fc';
        expValue = 5;
        damageToCore = 35;
      }

      enemies.push({
        x: Math.random() * (cw - size * 2 - 20) + size + 10,
        y: -size,
        size,
        hp,
        maxHp: hp,
        speed,
        color,
        type,
        expValue,
        damageToCore,
        shootTimer,
        vx
      });
    }

    function createExplosion(x, y, color = '#f97316', count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 150 + 40;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: Math.random() * 3.5 + 2,
          color,
          life: 0.35,
          maxLife: 0.35
        });
      }
    }

    function createShockwave(x, y, maxRadius, color = '#f97316') {
      shockwaves.push({
        x, y,
        radius: 5,
        maxRadius,
        color,
        life: 0.3,
        maxLife: 0.3
      });
    }

    // 手前・自機周辺を超ワイドにカバーし、奥に行くほど正面に絞るスマートオートロック
    function findAutoLockTarget() {
      let candidate = null;
      let highestUrgency = -Infinity;

      enemies.forEach(e => {
        // 自機の手前・横・後方防衛ライン付近まで全域カバー
        if (e.y <= player.y + 45) {
          const dx = e.x - player.x;
          const dy = e.y - player.y; // 負値（上方向）または微正値（自機真横・後方）
          const dist = Math.hypot(dx, dy);

          if (dist <= player.lockRange) {
            const distRatio = Math.max(0, Math.min(1, dist / player.lockRange)); // 0.0 (至近) 〜 1.0 (最遠)

            // 手前の許容横幅: 最大230px（画面全幅をほぼワイド迎撃！）, 奥の許容横幅: 最小32px（奥はピンポイント正面）
            const maxAllowedWidth = 230 * Math.pow(1 - distRatio * 0.75, 1.2);

            // 許容角度：手前側は左右約105度(1.85rad)の超ワイド迎撃、奥は左右約16度(0.28rad)の正面ピンポイント
            const angle = Math.atan2(dy, dx);
            let diff = Math.abs(angle - (-Math.PI / 2));
            while (diff > Math.PI) diff = Math.abs(diff - Math.PI * 2);

            const maxAllowedAngle = 1.85 * (1 - distRatio * 0.82);

            // 手前ワイド範囲内、または至近距離(85px以内)なら無条件に即座ロックオン！
            if ((Math.abs(dx) <= maxAllowedWidth && diff <= maxAllowedAngle) || dist < 85) {
              // 優先度スコアリング：防衛ラインや自機に近い（e.yが大きい）敵を圧倒的最優先！
              // すり抜けて自機手前横・後方に来た高速敵を最優先で迎撃
              const urgencyScore = (e.y * 4.2) - (dist * 0.35);
              if (urgencyScore > highestUrgency) {
                highestUrgency = urgencyScore;
                candidate = e;
              }
            }
          }
        }
      });
      return candidate;
    }

    function update(dt) {
      if (gameState !== 'playing') return;

      const rect = canvas.getBoundingClientRect();
      const cw = rect.width;
      const ch = rect.height;

      gameTime += dt;
      player.y = ch - 110;

      // BGM更新
      updateBGM(dt);

      // 環境パーティクル（宇宙の星、荒野の砂塵、深海の気泡）の更新
      envParticles.forEach(ep => {
        if (currentStage === 'ocean') {
          // 深海：気泡が下から上へフワフワ浮上
          ep.y -= ep.speed * 1.4 * dt;
          ep.x += Math.sin(gameTime * 2.5 + ep.size) * 18 * dt;
          if (ep.y < -15) { ep.y = ch + 15; ep.x = Math.random() * cw; }
        } else if (currentStage === 'wasteland') {
          // 荒野：砂塵が左から右へ強風で吹き抜ける
          ep.y += ep.speed * 0.5 * dt;
          ep.x += (ep.vx || 40) * dt;
          if (ep.x > cw + 20) { ep.x = -20; ep.y = Math.random() * ch; }
          if (ep.y > ch + 20) { ep.y = -10; ep.x = Math.random() * cw; }
        } else {
          // 宇宙：星屑が上から下へスクロール
          ep.y += ep.speed * dt;
          if (ep.y > ch + 10) { ep.y = -10; ep.x = Math.random() * cw; }
        }
      });

      if (player.invulnerable > 0) player.invulnerable -= dt;

      // キーボード移動
      if (keys['ArrowLeft'] || keys['a']) player.x -= player.baseSpeed * dt;
      if (keys['ArrowRight'] || keys['d']) player.x += player.baseSpeed * dt;
      player.x = Math.max(player.width / 2 + 10, Math.min(cw - player.width / 2 - 10, player.x));

      // 手前広角・奥狭角オートロック
      const target = findAutoLockTarget();
      player.targetEnemy = target;
      if (target) {
        const desiredAngle = Math.atan2(target.y - player.y, target.x - player.x);
        let diff = desiredAngle - player.aimAngle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        // 手前に迫った敵に対しては瞬時に銃口を向ける（超高速追従）
        const isClose = target.y > player.y - 140;
        const turnSpeed = isClose ? 32 : 18;
        player.aimAngle += diff * Math.min(1, dt * turnSpeed);
      } else {
        let diff = (-Math.PI / 2) - player.aimAngle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        player.aimAngle += diff * Math.min(1, dt * 10);
      }

      // 主砲ショット発射
      player.shotCooldown -= dt;
      if (player.shotCooldown <= 0) {
        player.shotCooldown = player.fireRate;
        playShootSound(); // 主砲ショット音
        const count = player.bulletCount;
        const spreadStep = 0.11;
        const baseAngle = player.aimAngle;
        const startAngle = baseAngle - (spreadStep * (count - 1)) / 2;

        for (let i = 0; i < count; i++) {
          const angle = startAngle + i * spreadStep;
          bullets.push({
            x: player.x,
            y: player.y - 12,
            vx: Math.cos(angle) * player.bulletSpeed,
            vy: Math.sin(angle) * player.bulletSpeed,
            damage: player.bulletDamage,
            pierce: 0,
            color: '#38bdf8'
          });
        }
      }

      // ⚡ ウィングレーザー（自機の左右にビット並び、真上へ直線レーザー照射）
      const wingLaserLvl = SKILLS.wing_laser.levelValue;
      if (wingLaserLvl > 0) {
        if (player.wingLaserActive > 0) {
          player.wingLaserActive -= dt;

          const isMax = wingLaserLvl >= 5;
          const laserWidth = isMax ? 14 : (4 + wingLaserLvl * 1.5);
          const dps = (45 + wingLaserLvl * 22) * (isMax ? 2.0 : 1.0);
          const bitOffsets = wingLaserLvl >= 3 ? [-42, -22, 22, 42] : [-25, 25];

          bitOffsets.forEach(offsetX => {
            const bx = player.x + offsetX;
            enemies.forEach(e => {
              if (e.y < player.y && Math.abs(e.x - bx) < (laserWidth / 2 + e.size)) {
                e.hp -= dps * dt;
                createExplosion(bx, e.y, '#38bdf8', 1);
              }
            });
          });
        } else {
          player.wingLaserCooldown -= dt;
          const rechargeTime = Math.max(0.7, 2.0 - wingLaserLvl * 0.25);
          if (player.wingLaserCooldown <= 0) {
            player.wingLaserCooldown = rechargeTime;
            player.wingLaserActive = wingLaserLvl >= 5 ? 0.75 : 0.45;
            screenShake = wingLaserLvl >= 5 ? 8 : 4;
            playLaserSound(); // レーザー照射音
          }
        }
      }

      // 💣 サテライトボム
      const bombLvl = SKILLS.orbital_bomb.levelValue;
      if (bombLvl > 0 && enemies.length > 0) {
        player.bombCooldown -= dt;
        const bombInterval = Math.max(1.0, 2.4 - bombLvl * 0.3);
        if (player.bombCooldown <= 0) {
          player.bombCooldown = bombInterval;
          const strikes = bombLvl >= 5 ? 2 : 1;

          for (let s = 0; s < strikes; s++) {
            const targetE = enemies[Math.floor(Math.random() * enemies.length)];
            if (targetE) {
              const radius = bombLvl >= 5 ? 85 : (45 + bombLvl * 8);
              const dmg = 35 + bombLvl * 15;
              bombTargets.push({
                x: targetE.x,
                y: targetE.y,
                targetEnemy: targetE,
                timer: 0.45,
                radius,
                dmg
              });
            }
          }
        }
      }

      // 爆撃タイマー更新
      bombTargets.forEach(b => {
        b.timer -= dt;
        if (b.targetEnemy && b.targetEnemy.hp > 0) {
          b.x = b.targetEnemy.x;
          b.y = b.targetEnemy.y;
        }

        if (b.timer <= 0 && !b.exploded) {
          b.exploded = true;
          screenShake = 12;
          playBombSound(); // ボム重低音爆発
          createShockwave(b.x, b.y, b.radius, '#f97316');
          createExplosion(b.x, b.y, '#ea580c', 28);

          enemies.forEach(e => {
            if (Math.hypot(e.x - b.x, e.y - b.y) <= b.radius + e.size) {
              e.hp -= b.dmg;
            }
          });
        }
      });
      bombTargets = bombTargets.filter(b => !b.exploded);

      // 🚀 迎撃スマートミサイル
      const missileLvl = SKILLS.interceptor_missile.levelValue;
      if (missileLvl > 0 && enemies.length > 0) {
        player.missileCooldown -= dt;
        const mInterval = Math.max(0.6, 1.8 - missileLvl * 0.25);
        if (player.missileCooldown <= 0) {
          player.missileCooldown = mInterval;
          playMissileSound(); // ミサイル発射音
          const count = missileLvl >= 5 ? 4 : (missileLvl >= 3 ? 2 : 1);

          for (let m = 0; m < count; m++) {
            const sortedByY = [...enemies].sort((a, b) => b.y - a.y);
            const targetM = sortedByY[Math.min(m, sortedByY.length - 1)];

            missiles.push({
              x: player.x + (m % 2 === 0 ? -14 : 14),
              y: player.y - 10,
              vx: (Math.random() - 0.5) * 100,
              vy: -220,
              damage: 28 + missileLvl * 12,
              target: targetM,
              life: 2.2
            });
          }
        }
      }

      missiles.forEach(m => {
        m.life -= dt;
        if (!m.target || m.target.hp <= 0) {
          let closest = null;
          let minDist = Infinity;
          enemies.forEach(e => {
            const d = Math.hypot(e.x - m.x, e.y - m.y);
            if (d < minDist) { minDist = d; closest = e; }
          });
          m.target = closest;
        }

        if (m.target) {
          const targetAngle = Math.atan2(m.target.y - m.y, m.target.x - m.x);
          const currentAngle = Math.atan2(m.vy, m.vx);
          let diff = targetAngle - currentAngle;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          const turn = Math.sign(diff) * Math.min(Math.abs(diff), dt * 9);
          const newAngle = currentAngle + turn;
          const spd = 460;
          m.vx = Math.cos(newAngle) * spd;
          m.vy = Math.sin(newAngle) * spd;
        }

        m.x += m.vx * dt;
        m.y += m.vy * dt;

        if (Math.random() < 0.4) {
          particles.push({
            x: m.x, y: m.y,
            vx: (Math.random() - 0.5) * 15,
            vy: (Math.random() - 0.5) * 15,
            size: 2,
            color: '#fb7185',
            life: 0.2,
            maxLife: 0.2
          });
        }
      });
      missiles = missiles.filter(m => m.life > 0 && m.y > -20);

      // 🛸 前衛パトロール機
      patrolDrones.forEach(d => {
        d.x += d.dir * d.speed * dt;
        if (d.x < 35) { d.x = 35; d.dir = 1; }
        else if (d.x > cw - 35) { d.x = cw - 35; d.dir = -1; }

        d.laserCooldown -= dt;
        if (d.laserCooldown <= 0) {
          let closestAbove = null;
          let minDist = 220;
          enemies.forEach(e => {
            if (e.y < d.y && Math.abs(e.x - d.x) < 45) {
              const dist = d.y - e.y;
              if (dist < minDist) { minDist = dist; closestAbove = e; }
            }
          });

          if (closestAbove) {
            d.laserCooldown = d.shootRate;
            closestAbove.hp -= d.damage;
            createExplosion(closestAbove.x, closestAbove.y, '#c084fc', 5);
            shockwaves.push({
              x: d.x, y: d.y,
              x2: closestAbove.x, y2: closestAbove.y,
              isBeam: true,
              color: '#c084fc',
              life: 0.12,
              maxLife: 0.12
            });
          }
        }

        enemies.forEach(e => {
          if (Math.hypot(e.x - d.x, e.y - d.y) < e.size + 18) {
            e.hp -= 40 * dt;
            createExplosion(d.x, d.y, '#a855f7', 2);
          }
        });
      });

      // 弾の更新
      bullets.forEach(b => {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
      });
      bullets = bullets.filter(b => b.y > -30 && b.y < ch + 30 && b.x > -30 && b.x < cw + 30 && b.pierce >= 0);

      // 敵弾更新
      enemyBullets.forEach(eb => {
        eb.x += eb.vx * dt;
        eb.y += eb.vy * dt;

        if (player.invulnerable <= 0) {
          if (Math.hypot(eb.x - player.x, eb.y - player.y) < player.width / 2 + 5) {
            player.hp -= eb.damage;
            player.invulnerable = 0.5;
            screenShake = 10;
            createExplosion(player.x, player.y, '#f43f5e', 14);
            eb.life = 0;
            updateHUD();
            if (player.hp <= 0) gameOver();
          }
        }
      });
      enemyBullets = enemyBullets.filter(eb => eb.life > 0 && eb.y < ch + 20);

      shockwaves.forEach(sw => sw.life -= dt);
      shockwaves = shockwaves.filter(sw => sw.life > 0);

      lightnings.forEach(l => l.life -= dt);
      lightnings = lightnings.filter(l => l.life > 0);

      // 👾 敵スポーン（時間経過 ＋ 獲得スキル数に応じたマイルドなスケーリング）
      enemySpawnTimer -= dt;
      const totalSkills = getTotalSkillLevel();
      // ベース間隔を0.6秒〜1.35秒と少し余裕を持たせ、スキル加算による加速もマイルドに
      const baseInterval = Math.max(0.6, 1.35 - gameTime * 0.012);
      const skillReduction = totalSkills * 0.018; // 以前の約半分に緩和
      const spawnInterval = Math.max(0.38, baseInterval - skillReduction); // 最速でも0.38秒間隔で一息つけるように

      if (enemySpawnTimer <= 0) {
        enemySpawnTimer = spawnInterval;
        spawnEnemy(cw);

        // スキル数がかなり揃った後半のみ、控えめな確率で追加1体湧き
        if (totalSkills >= 10 && Math.random() < 0.25) {
          spawnEnemy(cw);
        }
        if (totalSkills >= 18 && Math.random() < 0.20) {
          spawnEnemy(cw);
        }
      }

      const defenseLineY = ch - 65;

      // 敵更新
      enemies.forEach(e => {
        // ★チェイサー（自機追尾機）：自機のX座標をめがけてカーブ滑空
        if (e.type === 'chaser') {
          const targetDx = player.x - e.x;
          const steerForce = Math.sign(targetDx) * Math.min(Math.abs(targetDx) * 3.8, 190);
          e.vx = (e.vx || 0) + (steerForce - (e.vx || 0)) * dt * 4.5;
          e.x += e.vx * dt;
          e.x = Math.max(e.size + 8, Math.min(cw - e.size - 8, e.x));

          // 自機への特攻アタック（直接衝突で大ダメージ！）
          if (player.invulnerable <= 0) {
            if (Math.hypot(e.x - player.x, e.y - player.y) < e.size + player.width / 2) {
              player.hp -= 20;
              player.invulnerable = 0.6;
              screenShake = 14;
              createExplosion(player.x, player.y, '#10b981', 22);
              e.hp = 0; // 特攻自爆
              updateHUD();
              if (player.hp <= 0) gameOver();
              return;
            }
          }

          // 追尾バーニアエフェクト
          if (Math.random() < 0.25) {
            particles.push({
              x: e.x + (Math.random() - 0.5) * 6,
              y: e.y - e.size,
              vx: (Math.random() - 0.5) * 12,
              vy: -35,
              size: 2,
              color: '#34d399',
              life: 0.18,
              maxLife: 0.18
            });
          }
        }

        e.y += e.speed * dt;

        // シューター敵の射撃
        if (e.type === 'shooter') {
          e.shootTimer -= dt;
          if (e.shootTimer <= 0 && e.y > 20 && e.y < defenseLineY - 80) {
            e.shootTimer = 2.0 + Math.random() * 0.8;
            const angle = Math.atan2(player.y - e.y, player.x - e.x);
            const spd = 190;
            enemyBullets.push({
              x: e.x,
              y: e.y + e.size,
              vx: Math.cos(angle) * spd,
              vy: Math.sin(angle) * spd,
              damage: 15,
              life: 1
            });
            createExplosion(e.x, e.y + e.size, '#38bdf8', 4);
          }
        }

        // 防衛ライン直撃自爆
        if (e.y >= defenseLineY - e.size) {
          player.hp -= e.damageToCore;
          e.hp = 0;
          screenShake = 15;
          playCoreBreachSound(); // 防衛ライン突破警報ブザー
          createExplosion(e.x, defenseLineY, '#ef4444', 25);
          updateHUD();
          if (player.hp <= 0) gameOver();
          return;
        }

        // 主砲弾衝突
        bullets.forEach(b => {
          if (b.pierce >= 0 && Math.hypot(e.x - b.x, e.y - b.y) < e.size + 5) {
            e.hp -= b.damage;
            b.pierce -= 1;
            playHitSound(); // 敵着弾ヒット音
            createExplosion(b.x, b.y, b.color, 4);

            // チェインライトニング
            const chainLvl = SKILLS.chain_lightning.levelValue;
            if (chainLvl > 0) {
              const maxTargets = chainLvl >= 5 ? 6 : (chainLvl >= 3 ? 3 : 2);
              const chainDmg = 12 + chainLvl * 6;
              let hitCount = 0;

              enemies.forEach(next => {
                if (next !== e && hitCount < maxTargets && Math.hypot(next.x - e.x, next.y - e.y) < 135) {
                  next.hp -= chainDmg;
                  lightnings.push({
                    x1: e.x, y1: e.y,
                    x2: next.x, y2: next.y,
                    life: 0.16
                  });
                  hitCount++;
                }
              });
            }
          }
        });

        // ミサイル衝突
        missiles.forEach(m => {
          if (Math.hypot(e.x - m.x, e.y - m.y) < e.size + 12) {
            e.hp -= m.damage;
            m.life = 0;
            playExplodeSound(false); // ミサイル着弾爆発
            createExplosion(m.x, m.y, '#f43f5e', 16);
            createShockwave(m.x, m.y, 35, '#f43f5e');
            screenShake = 7;
          }
        });

        // 撃破
        if (e.hp <= 0) {
          score += e.expValue * 15;
          playExplodeSound(e.type === 'siege'); // 敵撃破音（シージ大型は重低音）
          createExplosion(e.x, e.y, e.color, 18);
          gems.push({
            x: e.x,
            y: e.y,
            vx: 0,
            vy: 35,
            value: e.expValue
          });
        }
      });
      enemies = enemies.filter(e => e.hp > 0);

      // ジェムのスマート吸引（前方ブースト）
      gems.forEach(g => {
        const dx = player.x - g.x;
        const dy = player.y - g.y;
        const dist = Math.hypot(dx, dy);
        const isAhead = dy > 0;
        
        let spd = 270;
        if (dist < player.magnetRange) spd = 500;
        if (isAhead) spd *= 1.85;

        g.x += (dx / dist) * spd * dt;
        g.y += (dy / dist) * spd * dt;

        if (dist < player.width / 2 + 14) {
          addExp(g.value);
          g.collected = true;
          playGemSound(); // ジェム回収チリン♪
          particles.push({
            x: g.x, y: g.y,
            vx: (Math.random() - 0.5) * 40,
            vy: -40,
            size: 2,
            color: '#34d399',
            life: 0.2,
            maxLife: 0.2
          });
        }
      });
      gems = gems.filter(g => !g.collected && g.y < ch);

      // パーティクル
      particles.forEach(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
      });
      particles = particles.filter(p => p.life > 0);

      if (screenShake > 0) screenShake -= dt * 30;
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      const cw = rect.width;
      const ch = rect.height;

      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      }
      // ===== ステージ別 美麗背景レンダリング（パララックス・カメラドリフト ＋ 動的環境パーティクル） =====
      const currentBgImg = stageImages[currentStage];
      const isImgReady = stageImagesLoaded[currentStage];

      if (isImgReady && currentBgImg) {
        // 画面比率より1.15倍大きく描画領域を確保（視差やドリフトで端が切れないシームレス設計）
        const scale = 1.15;
        const drawW = cw * scale;
        const drawH = ch * scale;
        const baseX = (cw - drawW) / 2;
        const baseY = (ch - drawH) / 2;

        // 自機の左右移動に連動するリアルタイム視差シフト（Parallax Shift）
        const playerShiftRatio = gameState === 'playing' ? ((player.x - cw / 2) / (cw / 2)) : 0;
        const parallaxX = -playerShiftRatio * 18;

        // ステージ特性に合わせた低周波カメラドリフト（呼吸・浮遊ワーク）
        let driftX = 0;
        let driftY = 0;
        if (currentStage === 'wasteland') {
          // 荒野：偵察ドローン視点のような緩やかな巡航カメラワーク
          driftX = Math.sin(gameTime * 0.35) * 12;
          driftY = Math.cos(gameTime * 0.28) * 14;
        } else if (currentStage === 'ocean') {
          // 深海：海流に身を委ねる潜水艇のような幻想的な浮遊感
          driftX = Math.sin(gameTime * 0.3) * 14;
          driftY = Math.sin(gameTime * 0.22) * 16;
        } else {
          // 宇宙：深淵の星雲を見下ろす雄大な低速カメラドリフト
          driftX = Math.sin(gameTime * 0.25) * 10;
          driftY = Math.cos(gameTime * 0.2) * 12;
        }

        // 継ぎ目の完全消滅した1枚絵を、生き生きと立体的に描画！
        ctx.drawImage(currentBgImg, baseX + parallaxX + driftX, baseY + driftY, drawW, drawH);

        // 弾や敵がくっきり見えるスマートな減光オーバーレイ
        ctx.fillStyle = currentStage === 'wasteland' ? 'rgba(15, 6, 3, 0.32)' : (currentStage === 'ocean' ? 'rgba(1, 10, 20, 0.32)' : 'rgba(5, 6, 15, 0.32)');
        ctx.fillRect(0, 0, cw, ch);
      } else {
        // フォールバック用グラデーション
        const bgGrad = ctx.createLinearGradient(0, 0, 0, ch);
        if (currentStage === 'wasteland') {
          bgGrad.addColorStop(0, '#1d0903');
          bgGrad.addColorStop(1, '#0d0402');
        } else if (currentStage === 'ocean') {
          bgGrad.addColorStop(0, '#06283d');
          bgGrad.addColorStop(1, '#01080d');
        } else {
          bgGrad.addColorStop(0, '#151738');
          bgGrad.addColorStop(1, '#04050a');
        }
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, cw, ch);
      }

      // ステージ専用の動的環境パーティクル（画像の美しさにリアルタイムな臨場感をプラス）
      if (currentStage === 'wasteland') {
        // 荒野：横殴りの砂嵐パーティクル
        envParticles.forEach(ep => {
          ctx.fillStyle = '#fb923c';
          ctx.globalAlpha = ep.opacity * 0.85;
          ctx.fillRect(ep.x, ep.y, ep.size * 1.8, ep.size * 0.8);
        });
        ctx.globalAlpha = 1.0;
      } else if (currentStage === 'ocean') {
        // 深海：下から水面へフワフワ浮上する気泡パーティクル
        envParticles.forEach(ep => {
          ctx.strokeStyle = 'rgba(103, 232, 249, 0.6)';
          ctx.fillStyle = 'rgba(103, 232, 249, 0.2)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(ep.x, ep.y, ep.size * 1.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });
      } else {
        // 宇宙：流れる星屑パーティクル
        envParticles.forEach(ep => {
          ctx.fillStyle = ep.speed > 35 ? '#c7d2fe' : '#ffffff';
          ctx.globalAlpha = ep.opacity;
          ctx.fillRect(ep.x, ep.y, ep.size, ep.size * 1.4);
        });
        ctx.globalAlpha = 1.0;
      }

      // 🎯 ロックオンマーカー（照準サークル＋4方向ブラケット＋レーザー照準ライン演出）
      // ※漏斗型範囲表示は非表示化し、ロックオン時の照準演出を洗練
      if (player.targetEnemy) {
        const te = player.targetEnemy;
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.8;
        ctx.shadowColor = '#0284c7';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(te.x, te.y, te.size + 8, 0, Math.PI * 2);
        ctx.stroke();

        // 4方向のミリタリー照準ブラケット
        const r = te.size + 12;
        ctx.beginPath();
        ctx.moveTo(te.x - r, te.y); ctx.lineTo(te.x - r + 5, te.y);
        ctx.moveTo(te.x + r, te.y); ctx.lineTo(te.x + r - 5, te.y);
        ctx.moveTo(te.x, te.y - r); ctx.lineTo(te.x, te.y - r + 5);
        ctx.moveTo(te.x, te.y + r); ctx.lineTo(te.x, te.y + r - 5);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // 自機からロックオン敵へのスマートなレーザー照準線
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - player.height / 2);
        ctx.lineTo(te.x, te.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // ⚡ ウィングレーザービット＆照射描画
      const wingLaserLvl = SKILLS.wing_laser.levelValue;
      if (wingLaserLvl > 0) {
        const bitOffsets = wingLaserLvl >= 3 ? [-42, -22, 22, 42] : [-25, 25];
        const isMax = wingLaserLvl >= 5;
        const laserWidth = isMax ? 14 : (4 + wingLaserLvl * 1.5);
        const isActive = player.wingLaserActive > 0;

        bitOffsets.forEach(offsetX => {
          const bx = player.x + offsetX;
          const by = player.y + 4;

          // ビット本体描画（自機の横に浮遊整列）
          ctx.save();
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = '#0284c7';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(bx, by, 4.5, 0, Math.PI * 2);
          ctx.fill();

          // 発射口
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(bx - 1.5, by - 6, 3, 3);

          // レーザービーム照射中なら真上へ直線をぶち抜く！
          if (isActive) {
            ctx.shadowBlur = isMax ? 20 : 12;
            ctx.shadowColor = isMax ? '#c084fc' : '#38bdf8';

            // レーザー光彩（外側）
            ctx.fillStyle = isMax ? 'rgba(192, 132, 252, 0.35)' : 'rgba(56, 189, 248, 0.35)';
            ctx.fillRect(bx - laserWidth / 2, 0, laserWidth, by);

            // レーザーコア（内側・白光）
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(bx - laserWidth / 5, 0, laserWidth / 2.5, by);
          }
          ctx.restore();
        });
      }

      // 💣 サテライトボム照準
      bombTargets.forEach(b => {
        const progress = 1 - (b.timer / 0.45);
        ctx.save();
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.stroke();

        const shrinkR = Math.max(0, b.radius * (1 - progress));
        ctx.fillStyle = 'rgba(249, 115, 22, 0.15)';
        ctx.beginPath();
        ctx.arc(b.x, b.y, shrinkR, 0, Math.PI * 2);
        ctx.fill();

        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(b.x - 10, b.y); ctx.lineTo(b.x + 10, b.y);
        ctx.moveTo(b.x, b.y - 10); ctx.lineTo(b.x, b.y + 10);
        ctx.stroke();
        ctx.restore();
      });

      // ショックウェーブ＆ビーム
      shockwaves.forEach(sw => {
        ctx.save();
        if (sw.isBeam) {
          ctx.strokeStyle = sw.color;
          ctx.lineWidth = 3;
          ctx.shadowColor = sw.color;
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.moveTo(sw.x, sw.y);
          ctx.lineTo(sw.x2, sw.y2);
          ctx.stroke();
        } else {
          const p = 1 - (sw.life / sw.maxLife);
          ctx.strokeStyle = sw.color;
          ctx.lineWidth = 3 * (1 - p);
          ctx.globalAlpha = 1 - p;
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.maxRadius * p, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      });

      // 🛸 前衛パトロール機
      patrolDrones.forEach(d => {
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.fillStyle = '#a855f7';
        ctx.shadowColor = '#c084fc';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(10, 8);
        ctx.lineTo(-10, 8);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 防衛ライン
      const defenseLineY = ch - 65;
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.65)';
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 10;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, defenseLineY);
      ctx.lineTo(cw, defenseLineY);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 操作パッドゾーン
      ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
      ctx.fillRect(0, defenseLineY + 2, cw, ch - defenseLineY);
      ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('◀  TOUCH & SWIPE HERE TO MOVE  ▶', cw / 2, ch - 22);

      // 電撃ライン
      lightnings.forEach(l => {
        ctx.strokeStyle = '#60a5fa';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#3b82f6';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(l.x1, l.y1);
        ctx.lineTo((l.x1 + l.x2) / 2 + (Math.random() - 0.5) * 20, (l.y1 + l.y2) / 2 + (Math.random() - 0.5) * 20);
        ctx.lineTo(l.x2, l.y2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      });

      // ジェム
      gems.forEach(g => {
        ctx.fillStyle = g.value >= 5 ? '#c084fc' : (g.value >= 2 ? '#38bdf8' : '#34d399');
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(g.x, g.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // 自機通常弾
      bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // 🚀 ミサイル
      missiles.forEach(m => {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.rotate(Math.atan2(m.vy, m.vx) + Math.PI / 2);
        ctx.fillStyle = '#f43f5e';
        ctx.shadowColor = '#fb7185';
        ctx.shadowBlur = 8;
        ctx.fillRect(-3, -8, 6, 16);
        ctx.restore();
      });

      // 敵弾
      enemyBullets.forEach(eb => {
        ctx.fillStyle = '#f43f5e';
        ctx.shadowColor = '#fb7185';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // 敵
      enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();

        if (e.type === 'chaser') {
          // 自機追尾チェイサー：進行方向（e.vx, e.speed）を向いて滑空するステルス戦闘機
          ctx.save();
          ctx.translate(e.x, e.y);
          const moveAngle = Math.atan2(e.speed, e.vx || 0) - Math.PI / 2;
          ctx.rotate(moveAngle);

          ctx.beginPath();
          ctx.moveTo(0, e.size * 1.2);
          ctx.lineTo(e.size * 1.15, -e.size * 0.8);
          ctx.lineTo(0, -e.size * 0.25);
          ctx.lineTo(-e.size * 1.15, -e.size * 0.8);
          ctx.closePath();
          ctx.fill();

          // コアアイ
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else if (e.type === 'shooter') {
          ctx.moveTo(e.x, e.y - e.size);
          ctx.lineTo(e.x + e.size, e.y);
          ctx.lineTo(e.x, e.y + e.size);
          ctx.lineTo(e.x - e.size, e.y);
          ctx.closePath();
          ctx.fill();
        } else if (e.type === 'rusher') {
          ctx.moveTo(e.x, e.y + e.size * 1.2);
          ctx.lineTo(e.x - e.size, e.y - e.size);
          ctx.lineTo(e.x, e.y - e.size * 0.4);
          ctx.lineTo(e.x + e.size, e.y - e.size);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;

        if (e.hp < e.maxHp) {
          const barW = e.size * 2;
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(e.x - e.size, e.y - e.size - 8, barW, 3.5);
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(e.x - e.size, e.y - e.size - 8, barW * (e.hp / e.maxHp), 3.5);
        }
      });

      // 自機
      if (player.invulnerable <= 0 || Math.floor(gameTime * 25) % 2 === 0) {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.aimAngle + Math.PI / 2);

        ctx.fillStyle = '#4f46e5';
        ctx.shadowColor = '#818cf8';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(0, 0, player.width / 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(-3.5, -player.height * 0.9, 7, player.height * 0.9);

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      }

      // パーティクル
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;

      ctx.restore();
    }

    function gameOver() {
      gameState = 'gameover';
      const screen = document.getElementById('overlay-screen');
      document.getElementById('overlay-title').textContent = 'DEFENSE BREACHED';
      document.getElementById('overlay-title').className = 'text-2xl font-black text-rose-500 mb-2';
      document.getElementById('overlay-subtitle').innerHTML = `防衛シールドが突破されました！<br>生存時間: ${document.getElementById('time-display').textContent}<br>スコア: ${score}<br>到達レベル: LV ${player.level}`;
      document.getElementById('start-btn').textContent = 'RETRY MISSION';
      screen.classList.remove('hidden');
    }

    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      if (gameState === 'playing') {
        update(dt);
      } else if (gameState === 'ready') {
        // スタート待機中も背景環境パーティクルを心地よくアニメーション
        const rect = canvas.getBoundingClientRect();
        const cw = rect.width;
        const ch = rect.height;
        gameTime += dt;
        envParticles.forEach(ep => {
          if (currentStage === 'ocean') {
            ep.y -= ep.speed * 1.2 * dt;
            ep.x += Math.sin(gameTime * 2.5 + ep.size) * 16 * dt;
            if (ep.y < -15) { ep.y = ch + 15; ep.x = Math.random() * cw; }
          } else if (currentStage === 'wasteland') {
            ep.y += ep.speed * 0.5 * dt;
            ep.x += (ep.vx || 40) * dt;
            if (ep.x > cw + 20) { ep.x = -20; ep.y = Math.random() * ch; }
            if (ep.y > ch + 20) { ep.y = -10; ep.x = Math.random() * cw; }
          } else {
            ep.y += ep.speed * dt;
            if (ep.y > ch + 10) { ep.y = -10; ep.x = Math.random() * cw; }
          }
        });
      }
      draw();

      requestAnimationFrame(gameLoop);
    }

    // ステージ選択ボタンのインタラクション
    const stageButtons = document.querySelectorAll('.stage-btn');
    stageButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const stage = btn.getAttribute('data-stage');
        if (!stage) return;
        currentStage = stage;
        stageButtons.forEach(b => {
          b.classList.remove('active', 'border-indigo-500', 'bg-indigo-600/30', 'text-white', 'shadow', 'shadow-indigo-500/20');
          b.classList.add('border-slate-700', 'bg-slate-800/50', 'text-slate-400');
        });
        btn.classList.add('active', 'border-indigo-500', 'bg-indigo-600/30', 'text-white', 'shadow', 'shadow-indigo-500/20');
        btn.classList.remove('border-slate-700', 'bg-slate-800/50', 'text-slate-400');

        const rect = canvas.getBoundingClientRect();
        initEnvParticles(rect.width, rect.height);
      });
    });

    // サウンド切替ボタン（🔊 / 🔇）
    const soundToggleBtn = document.getElementById('sound-toggle-btn');
    soundToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMute();
    });

    // ヘッダー音量スライダー
    const soundVolSlider = document.getElementById('sound-volume-slider');
    soundVolSlider.addEventListener('input', (e) => {
      e.stopPropagation();
      initAudio();
      if (soundMuted) soundMuted = false;
      setMasterVolume(e.target.value);
    });

    // スタート画面音量スライダー
    const overlayVolSlider = document.getElementById('overlay-vol-slider');
    overlayVolSlider.addEventListener('input', (e) => {
      initAudio();
      if (soundMuted) soundMuted = false;
      setMasterVolume(e.target.value);
    });

    // スタート画面音量アイコン
    const overlayVolIcon = document.getElementById('overlay-vol-icon');
    overlayVolIcon.addEventListener('click', () => {
      toggleMute();
    });

    document.getElementById('start-btn').addEventListener('click', () => {
      initAudio();
      document.getElementById('overlay-screen').classList.add('hidden');
      initGame();
      gameState = 'playing';
      lastTime = performance.now();
    });

    resizeCanvas();
    const initRect = canvas.getBoundingClientRect();
    initEnvParticles(initRect.width, initRect.height);
    updateVolumeUI();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
