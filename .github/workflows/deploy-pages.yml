name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dungeon-survivor/package-lock.json

      - name: Install, Test & Build dungeon-survivor
        working-directory: dungeon-survivor
        run: |
          npm ci
          npm test
          npm run build

      - name: Assemble GitHub Pages site
        run: |
          rm -rf _site
          mkdir -p _site/dungeon-survivor
          cp index.html _site/
          cp -r vertical-survivor-rogue _site/
          cp -r dungeon-survivor/dist/* _site/dungeon-survivor/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
