name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dungeon-survivor/package-lock.json

      - name: Install, Test & Build dungeon-survivor
        working-directory: dungeon-survivor
        run: |
          npm ci
          npm test
          npm run build

      - name: Assemble GitHub Pages site
        run: |
          rm -rf _site
          mkdir -p _site/dungeon-survivor
          cp index.html _site/
          cp -r vertical-survivor-rogue _site/
          cp -r dungeon-survivor/dist/* _site/dungeon-survivor/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          exclude_assets: '.github,pr-preview'
