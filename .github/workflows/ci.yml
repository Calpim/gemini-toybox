name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dungeon-survivor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dungeon-survivor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check (Biome)
        run: npm run check:ci

      - name: Check dead code (Knip)
        run: npm run knip

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check specs.html sync
        run: git diff --exit-code docs/specs.html
