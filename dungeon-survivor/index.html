<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dungeon Survivor — Phase 1 Prototype</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050811;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    }
    #gameCanvas {
      display: block;
      touch-action: none;
    }
    .hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      z-index: 10;
      flex-wrap: wrap;
    }
    .hud-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(7, 11, 20, 0.82);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .hp-bar {
      width: 110px;
      height: 10px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #ef4444, #10b981);
      transition: width 0.1s linear;
    }
    .spec-link {
      pointer-events: auto;
      color: #7dd3fc;
      text-decoration: none;
      font-size: 12px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.85);
    }
    .hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(7, 11, 20, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 12px;
      color: #cbd5e1;
      pointer-events: none;
      white-space: nowrap;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal.hidden { display: none; }
    .modal-card {
      background: #0f172a;
      border: 1px solid rgba(248, 113, 113, 0.45);
      border-radius: 16px;
      padding: 24px 28px;
      text-align: center;
      max-width: 340px;
      width: 90%;
    }
    .modal-card h2 { margin: 0 0 8px; color: #fca5a5; }
    .modal-card p { color: #cbd5e1; font-size: 14px; margin: 0 0 18px; }
    .btn {
      background: linear-gradient(90deg, #0284c7, #6366f1);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 22px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-group">
      <strong id="floorText" style="color:#22d3ee">1F</strong>
      <div class="hp-bar"><div id="hpFill" class="hp-fill" style="width:100%"></div></div>
      <span id="hpText">100 / 100</span>
    </div>
    <div class="hud-group">
      <span id="levelText" style="color:#38bdf8">LV 1 (SP 0)</span>
      <span id="killsText" style="color:#fda4af">KILLS 0</span>
      <a class="spec-link" href="./specs.html" target="_blank" rel="noopener">仕様書</a>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>
  <div class="hint">WASD / 矢印キー / 画面ドラッグで移動 · オート迎撃稼働中</div>

  <div id="gameOverModal" class="modal hidden">
    <div class="modal-card">
      <h2>SIGNAL LOST</h2>
      <p id="gameOverSummary"></p>
      <button id="retryBtn" class="btn">リトライ</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
