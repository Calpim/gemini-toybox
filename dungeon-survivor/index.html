<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Dungeon Survivor — Phase 2-A</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      position: fixed;
      inset: 0;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #050811;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .hud {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      z-index: 10;
      flex-wrap: wrap;
    }
    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(7, 11, 20, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 5px 10px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .hp-bar {
      width: 84px;
      height: 9px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #ef4444, #10b981);
      transition: width 0.1s linear;
    }
    .skill-btn {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.9);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
    }
    .skill-btn.has-sp {
      background: linear-gradient(90deg, #0284c7, #7c3aed);
      color: #fff;
      border-color: #fde047;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.55);
    }
    .spec-link {
      pointer-events: auto;
      color: #7dd3fc;
      text-decoration: none;
      font-size: 11px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.85);
    }
    .hint {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(7, 11, 20, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 11px;
      color: #cbd5e1;
      pointer-events: none;
      white-space: nowrap;
      max-width: calc(100vw - 24px);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.84);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 30;
    }
    .modal.hidden { display: none; }
    .modal-panel {
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      max-width: 780px;
      max-height: 88vh;
      overflow-y: auto;
      touch-action: pan-y;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .modal-head h2 { margin: 0; font-size: 18px; color: #f8fafc; }
    .sp-badge {
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #7dd3fc;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .tree-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .tree-col {
      background: #090f1d;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tree-col-head {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 4px;
      text-align: center;
    }
    .tree-arrow {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      line-height: 1;
    }
    .tree-node {
      text-align: left;
      border-radius: 10px;
      padding: 9px 10px;
      border: 1px solid #334155;
      background: #131c31;
      color: #e2e8f0;
      cursor: pointer;
    }
    .tree-node.unlocked {
      border-color: #34d399;
      background: rgba(16, 185, 129, 0.14);
    }
    .tree-node.available {
      border-color: #38bdf8;
      background: rgba(14, 165, 233, 0.2);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }
    .tree-node.locked {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .node-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .node-state { font-size: 11px; color: #94a3b8; }
    .tree-node.unlocked .node-state { color: #34d399; font-weight: 700; }
    .tree-node.available .node-state { color: #fde047; font-weight: 700; }
    .node-desc { font-size: 12px; color: #cbd5e1; margin-bottom: 4px; }
    .node-req { font-size: 10px; color: #94a3b8; }
    .gear-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .gear-pill {
      font-size: 11px;
      border: 1px solid #334155;
      background: #0b1222;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .drop-card {
      background: #090f1d;
      border: 1px solid #fbbf24;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .drop-badge { font-size: 11px; font-weight: 700; }
    .drop-name { font-size: 16px; font-weight: 800; margin: 2px 0 4px; }
    .drop-desc { font-size: 12px; color: #cbd5e1; }
    .slot-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .slot-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #131c31;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .slot-action { color: #38bdf8; font-weight: 700; font-size: 12px; }
    .modal-card {
      background: #0f172a;
      border: 1px solid rgba(248, 113, 113, 0.45);
      border-radius: 16px;
      padding: 24px 28px;
      text-align: center;
      max-width: 340px;
      width: 90%;
    }
    .modal-card h2 { margin: 0 0 8px; color: #fca5a5; }
    .modal-card p { color: #cbd5e1; font-size: 14px; margin: 0 0 18px; }
    .btn {
      background: linear-gradient(90deg, #0284c7, #6366f1);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }
    .btn-scrap {
      background: linear-gradient(90deg, #d97706, #ea580c);
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-group">
      <strong id="floorText" style="color:#22d3ee">1F</strong>
      <div class="hp-bar"><div id="hpFill" class="hp-fill" style="width:100%"></div></div>
      <span id="hpText">100 / 100</span>
    </div>
    <div class="hud-group">
      <button id="skillBtn" type="button" class="skill-btn">🌳 LV1 (SP 0)</button>
      <span id="gearCountText" style="color:#fbbf24">GEAR 2/3</span>
      <span id="killsText" style="color:#fda4af">KILLS 0</span>
      <a class="spec-link" href="./specs.html" target="_blank" rel="noopener">仕様書</a>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>
  <div class="hint">移動: ドラッグ/WASD · Kキー/🌳ボタンでスキルツリー · 同種装備で自動LvUP</div>

  <div id="skillModal" class="modal hidden">
    <div class="modal-panel">
      <div class="modal-head">
        <h2>🌳 スキルツリー（前提強化）</h2>
        <span id="skillSpBadge" class="sp-badge">所持 SP: 0</span>
      </div>
      <div id="skillColumns" class="tree-grid"></div>
      <div style="font-size:12px;color:#94a3b8;margin-bottom:6px;">装着中の装備</div>
      <div id="skillGearSummary" class="gear-summary"></div>
      <button id="closeSkillBtn" type="button" class="btn">戦闘に戻る</button>
    </div>
  </div>

  <div id="equipModal" class="modal hidden">
    <div class="modal-panel" style="max-width:440px">
      <div class="modal-head">
        <h2>📦 装備スロット満杯（3/3）</h2>
      </div>
      <div id="equipDropCard" class="drop-card"></div>
      <button id="scrapEquipBtn" type="button" class="btn btn-scrap">🔧 スクラップ変換（装着中の全装備 Lv+1）</button>
      <div style="font-size:12px;color:#94a3b8;margin:10px 0 6px;">または既存スロットと入れ替え：</div>
      <div id="equipSlotList" class="slot-list"></div>
    </div>
  </div>

  <div id="gameOverModal" class="modal hidden">
    <div class="modal-card">
      <h2>SIGNAL LOST</h2>
      <p id="gameOverSummary"></p>
      <button id="retryBtn" class="btn">リトライ</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
